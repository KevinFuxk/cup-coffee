name: Daily factor update

# After the US close, on weekdays. 22:00 UTC = 6pm EDT / 5pm ET-winter — always
# after the 4pm ET close, and it auto-shifts nothing (cron is UTC). Also runnable
# by hand from the Actions tab (with an optional dry run that doesn't commit).
on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without committing results (smoke test)'
        type: boolean
        default: false

permissions:
  contents: write          # so the job can commit the updated data back

concurrency:
  group: daily-factor-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Detect today's trades, re-score factors
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python daily_update.py
      - name: Commit updated data back to the repo
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "cup-coffee-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "no changes — nothing to commit"
          else
            git commit -m "daily factor update $(date -u +%F)"
            git push
          fi
